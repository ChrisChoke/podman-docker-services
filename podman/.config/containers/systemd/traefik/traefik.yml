api:
  dashboard: true
  debug: true
entryPoints:
  # The name "web" matches
  # the setting "FileDescriptorName=web" in the file http.socket
  # Traefik inherits the socket from systemd (the parent process).
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  # The name "websecure" matches
  # the setting "FileDescriptorName=websecure" in the file http.socket
  # Traefik inherits the socket from systemd (the parent process).
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs: 
        - 192.168.1.10
  udp-jf:
    address: ":7359/udp"
serversTransport:
  insecureSkipVerify: true
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
