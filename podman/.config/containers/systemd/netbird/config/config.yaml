# Combined NetBird Server Configuration (Simplified)
# Generated by getting-started.sh

server:
  listenAddress: ":80"
  exposedAddress: "https://netbird.example.com:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  # authSecret = openssl rand -base64 32
  authSecret: "B8yBffuuqksWpx7D88ffz4YWNYTBn9mhmY6DSwpRxG4="
  dataDir: "/var/lib/netbird"

  auth:
    issuer: "https://netbird.example.com/oauth2"
    signKeyRefreshEnabled: true
    sessionCookieEncryptionKey: "vb29eE7xPbSQZn6R8HNuK8QUp28WrQSAqmEk/65PquM=" # openssl rand -base64 32
    dashboardRedirectURIs:
      - "https://netbird.example.com/nb-auth"
      - "https://netbird.example.com/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    trustedHTTPProxies:
      - "10.89.0.0/16" # podman default pasta network. you can configure static ip as well for the reverse proxy
    trustedPeers:
      - "10.89.0.0/16"

  store:
    engine: "sqlite"
    encryptionKey: "aGLrZmMz89broIt5baZKgTTFd+RjLcv22kBKI+18opo=" # openssl rand -base64 32
